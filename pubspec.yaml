name: nasaq_market
description: "نسق ماركت: محاسبة ومخزون للمحلات التجارية (أندرويد، بيانات محلية + Google Drive)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  android_id: ^0.6.0
  cloud_firestore: ^7.1.0
  crypto: ^3.0.8
  csv: ^8.0.0
  drift: ^2.35.3
  excel: ^4.0.6
  file_picker: ^13.3.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
  assets:
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf
