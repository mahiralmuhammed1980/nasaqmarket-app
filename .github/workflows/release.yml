name: Release APK
# يُشغَّل يدوياً (Run workflow) أو عند دفع وسم. الوسم يُشتق من version في pubspec.yaml: 1.0.0+1 → v1.0.0-1
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: التحقق من الأسرار المطلوبة
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KS" || { echo "::error::السر ANDROID_KEYSTORE_BASE64 مفقود (مفتاح التوقيع ضروري لتعمل التحديثات)"; exit 1; }
          test -n "$GS" || { echo "::error::السر GOOGLE_SERVICES_JSON_BASE64 مفقود (إعداد Firebase)"; exit 1; }

      - name: مفتاح التوقيع وإعداد Firebase
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/release.jks
          echo "$GS" | base64 -d > android/app/google-services.json
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: بناء APK
        env:
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=LICENSE_SECRET="$LICENSE_SECRET" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=UPDATE_URL="https://github.com/${{ github.repository }}/releases/latest/download/version.json"
          cp build/app/outputs/flutter-apk/app-release.apk nasaq_pharma.apk

      - name: ملف الإصدار (version.json)
        run: python3 tool/make_version_json.py nasaq_pharma.apk "${{ github.repository }}" version.json "$(git log -1 --pretty=%s)"

      - name: قراءة الإصدار
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=v${V/+/-}" >> "$GITHUB_OUTPUT"

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: نسق فارما ${{ steps.ver.outputs.tag }}
          files: |
            nasaq_pharma.apk
            version.json
