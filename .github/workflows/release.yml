name: Release APK
# يُشغَّل يدوياً (Actions ← Release APK ← Run workflow).
# الوسم يُشتق من version في pubspec.yaml: 1.0.0+1 ← v1.0.0-1 (ارفع الرقم بعد + عند كل إصدار).
# ينشر على Releases: nasaq_market.apk (للمندوبين والزبائن) و version.json (يقرؤه التحديث الداخلي).
# يبني أيضاً AAB كملف مرفق (للانتقال لاحقاً إلى Google Play).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: التحقق من الأسرار المطلوبة
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KS" || { echo "::error::السر ANDROID_KEYSTORE_BASE64 مفقود (مفتاح التوقيع ضروري)"; exit 1; }
          test -n "$GS" || { echo "::error::السر GOOGLE_SERVICES_JSON_BASE64 مفقود (التفعيل بالأكواد يحتاجه)"; exit 1; }

      - name: مفتاح التوقيع
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/release.jks
          echo "$GS" | base64 -d > android/app/google-services.json
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: بناء APK و AAB
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        run: |
          DEFS="--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID --dart-define=LICENSE_SECRET=$LICENSE_SECRET --dart-define=UPDATE_URL=https://github.com/${{ github.repository }}/releases/latest/download/version.json"
          flutter build apk --release $DEFS
          flutter build appbundle --release $DEFS
          cp build/app/outputs/flutter-apk/app-release.apk nasaq_market.apk

      - name: تشخيص تسجيل Google (لا يطبع أسراراً)
        env:
          WEB_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "== بصمة توقيع الـ APK الفعلية (يجب أن تطابق SHA-1 في Firebase: 12:79:7E:BA:...:2A:7E) =="
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs nasaq_market.apk 2>&1 | grep -E "certificate (SHA-1|SHA-256) digest|Verifies" || echo "تعذّر قراءة التوقيع"
          echo "== بصمة المفتاح المخزَّن في الأسرار =="
          keytool -list -v -keystore android/app/release.jks -alias "$KEY_ALIAS" -storepass "$KS_PASS" 2>&1 | grep -E "SHA1:|SHA256:|Alias name" || echo "تعذّر فتح المفتاح (كلمة المرور أو الاسم المستعار خطأ؟)"
          echo "== معرّف Web =="
          echo "طوله: ${#WEB_ID}"
          echo "رقم المشروع (يجب أن يكون 9476925350): ${WEB_ID%%-*}"
          PFX="${WEB_ID#*-}"; PFX="${PFX:0:8}"
          echo "بداية الجزء الثاني: $PFX"
          case "$PFX" in 3qu516t0) echo "صحيح: هذا معرّف Web";; mm6deahg) echo "خطأ: هذا معرّف Android، المطلوب معرّف Web (3qu516t0...)";; *) echo "غير معروف: قارنه بمعرّف Web في Google Cloud";; esac
          case "$WEB_ID" in *.apps.googleusercontent.com) echo "النهاية صحيحة";; *) echo "تحذير: لا ينتهي بـ .apps.googleusercontent.com";; esac
          case "$WEB_ID" in *" "*|*$'\n'*) echo "تحذير: فيه مسافة أو سطر جديد";; *) echo "بلا مسافات";; esac

      - name: ملف الإصدار (version.json)
        run: python3 tool/make_version_json.py nasaq_market.apk "${{ github.repository }}" version.json "$(git log -1 --pretty=%s)"

      - name: قراءة الإصدار
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=v${V/+/-}" >> "$GITHUB_OUTPUT"

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # الوسم الجديد يُنشأ على الـ commit الذي بُني منه الـ APK (وليس على آخر commit في main)
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          name: نسق ماركت ${{ steps.ver.outputs.tag }}
          files: |
            nasaq_market.apk
            version.json

      - uses: actions/upload-artifact@v4
        with:
          name: nasaq-market-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
