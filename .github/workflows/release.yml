name: Release AAB
# يُشغَّل يدوياً (Run workflow). يبني حزمة AAB موقّعة بمفتاح الرفع (Upload key) لرفعها إلى Google Play Console.
# التحديث للمستخدمين يتم عبر Google Play، فلا حاجة لـ APK أو version.json.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: التحقق من الأسرار المطلوبة
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KS" || { echo "::error::السر ANDROID_KEYSTORE_BASE64 مفقود (مفتاح التوقيع ضروري)"; exit 1; }
          test -n "$GS" || { echo "::error::السر GOOGLE_SERVICES_JSON_BASE64 مفقود (التفعيل بالأكواد يحتاجه)"; exit 1; }

      - name: مفتاح التوقيع
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/release.jks
          echo "$GS" | base64 -d > android/app/google-services.json
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: بناء AAB
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        run: |
          flutter build appbundle --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=LICENSE_SECRET="$LICENSE_SECRET"

      - uses: actions/upload-artifact@v4
        with:
          name: nasaq-market-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
